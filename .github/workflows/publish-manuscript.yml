name: Publish manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'submission/manuscript.tex'
      - 'build_manuscript.sh'
      - 'checks/sync_submission.py'
      - '.github/workflows/publish-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current manuscript
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils

      - name: Build the current manuscript
        run: |
          python3 checks/sync_submission.py
          bash build_manuscript.sh
          test -s manuscript.pdf
          pdfinfo manuscript.pdf | grep -E '^Pages:[[:space:]]+33$'

      - name: Refresh publication checksums
        run: |
          python3 checks/refresh_checksums.py
          sha256sum -c SHA256SUMS.txt

      - name: Commit regenerated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript.pdf submission/manuscript.tex SHA256SUMS.txt checks/logs/latex_build.log
          if ! git diff --cached --quiet; then
            git commit -m "Publish current Hoeffding manuscript PDF [skip ci]"
            git push origin HEAD:main
          fi
