name: Verify and publish exact Hoeffding manuscript

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'submission/manuscript.tex'
      - 'checks/**'
      - 'docs/**'
      - 'requirements.txt'
      - 'run_all.sh'
      - 'build_manuscript.sh'
      - '.github/workflows/publish-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current manuscript
        uses: actions/checkout@v4

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science lmodern poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mathematical test requirements
        run: python3 -m pip install -r requirements.txt

      - name: Synchronize the submission source
        run: python3 checks/sync_submission.py

      - name: Run the complete mathematical test suite and build both PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checks/logs
          bash run_all.sh | tee checks/logs/run_all.log

      - name: Verify all PDFs and both independent certificates
        shell: bash
        run: |
          set -euo pipefail
          test -s manuscript.pdf
          test -s supplementary_refinements.pdf
          test -s docs/proof_certification_2026-10-11.pdf
          pages="$(pdfinfo manuscript.pdf | awk '/^Pages:/ {print $2}')"
          test "${pages}" -ge 27 && test "${pages}" -le 30
          grep -q '^PASS:' checks/logs/verify_even_envelope_extension.log
          grep -q 'ALL independent certificate checks passed' checks/logs/verify_independent_certificates.log
          grep -q 'PASS: all mathematical computation logs' checks/logs/package_validation.log
          printf 'Primary paper: %s pages; all test logs are present.\n' "$pages"

      - name: Recompute and verify release checksums
        run: |
          python3 checks/refresh_checksums.py
          sha256sum -c SHA256SUMS.txt

      - name: Publish verified PDFs and computation logs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript.pdf supplementary_refinements.pdf docs/proof_certification_2026-10-11.pdf submission/manuscript.tex \
            SHA256SUMS.txt checks/logs/*.log
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified 28-page manuscript, supplement and full test logs [skip ci]'
            git push origin HEAD:main
          fi
