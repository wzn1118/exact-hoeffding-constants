name: Build and publish current Main+A+B manuscript

on:
  push:
    branches: [main]
    paths:
      - 'submission/integrated/build_clean_submission.py'
      - 'submission/current/manuscript.tex'
      - 'submission/current/display_formula_inventory.json'
      - 'submission/current/display_formula_review_bindings.json'
      - 'submission/manuscript.tex'
      - 'research/tail_bounds/minimum_variance_tail.tex'
      - 'goal_b/paper/main.tex'
      - 'checks/**'
      - 'formal_status/**'
      - 'requirements.txt'
      - 'goal_b/requirements.txt'
      - '.github/workflows/clean-integrated-submission.yml'
  workflow_dispatch:

concurrency:
  group: canonical-main-manuscript-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  clean-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install LaTeX and archive tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-science \
            lmodern latexmk poppler-utils zip
      - name: Build unified paper
        run: |
          python3 submission/integrated/build_clean_submission.py
          cd submission/integrated
          latexmk -pdf -interaction=nonstopmode -halt-on-error combined_manuscript.tex
          test -s combined_manuscript.pdf
      - name: Verify exact-rational factorial minimizer and endpoint ties
        run: python3 checks/verify_factorial_minimizer.py
      - name: Refresh theorem–Lean concordance for integrated source
        run: python3 checks/render_full_manuscript_concordance.py
      - name: Install pinned Lean toolchain for the kernel audit
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib artifacts and build formal development
        run: |
          lake exe cache get
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          lake build ExactHoeffding
      - name: Audit manuscript theorem-to-Lean correspondence
        run: |
          python3 checks/check_full_manuscript_concordance.py
          python3 checks/check_semantic_contract_integrity.py --require-contracts
      - name: Assemble synchronized official submission and full reproducibility
        run: |
          python3 checks/build_current_release.py
          python3 checks/refresh_checksums.py
          sha256sum -c SHA256SUMS.txt
      - name: Verify independent extraction and repeat-run regression cases
        run: |
          python3 checks/test_reproducibility_bundle.py
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          import subprocess
          import sys
          with TemporaryDirectory() as directory:
              with ZipFile("submission/current/complete-reproducibility.zip") as archive:
                  archive.extractall(directory)
              for script, args in (
                  ("manuscript_display_inventory.py", ["--check"]),
                  ("check_display_formula_review_binding.py", []),
                  ("check_semantic_contract_integrity.py", ["--require-contracts"]),
                  ("check_theorem_manifest.py", ["--check"]),
                  ("generate_axiom_audit.py", ["--check"]),
              ):
                  subprocess.run([sys.executable, "checks/" + script, *args], cwd=directory, check=True)
          PY
      - name: Verify three source and archive formats
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import subprocess
          folder=Path("submission/current")
          for archive in ("arxiv-source.zip","clean-submission.zip","complete-reproducibility.zip"):
              with ZipFile(folder/archive) as z:
                  assert z.testzip() is None, archive
          with ZipFile(folder/"arxiv-source.zip") as z:
              assert z.namelist()==["manuscript.tex"]
          with ZipFile(folder/"complete-reproducibility.zip") as z:
              entries=set(z.namelist())
              assert "ExactHoeffding.lean" in entries
              assert "lake-manifest.json" in entries
              assert "checks/verify_piecewise_kl.py" in entries
              assert "README.txt" in entries
          print("Three archive checks PASS")
          PY
      - name: Publish canonical files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/current/ SHA256SUMS.txt \
            formal_status/current_pdf_lean_reconciliation_20261018.md \
            formal_status/manuscript_concordance.md \
            formal_status/semantic_contract_audit_20261017.md \
            formal_status/baseline_protection_20261017.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish current unified manuscript and complete clean reproducibility [skip ci]'
            # Never rebase a generated publication onto unverified new inputs.
            # A newer main run will rebuild and publish from its own checkout.
            git push origin HEAD:main
          fi
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: Current-Main-A-B-Submission-and-Reproducibility
          path: |
            submission/current/manuscript.pdf
            submission/current/manuscript.tex
            submission/current/arxiv-source.zip
            submission/current/clean-submission.zip
            submission/current/complete-reproducibility.zip
            submission/current/metadata.json
          retention-days: 90
